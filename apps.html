<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>应用设计 — Huijing Gong</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/apps.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="apps-page">

  <canvas id="bg-canvas"></canvas>

  <nav class="nav-v2 scrolled">
    <a href="index.html" class="nav-v2-brand">HG</a>
    <div class="nav-v2-links">
      <a href="index.html" class="nav-v2-link">← 返回</a>
      <a href="product.html" class="nav-v2-link">产品设计</a>
      <a href="art.html" class="nav-v2-link">艺术设计</a>
    </div>
  </nav>

  <header class="apps-header-v2">
    <h1 class="apps-title-v2">应用设计</h1>
    <p class="apps-desc-v2">App Design — 从用户研究到高保真交互原型</p>
  </header>

  <!-- Phone + Info Layout -->
  <section class="apps-stage-v2">
    <div class="apps-layout-v2">

      <!-- 3D Phone -->
      <div class="phone-column">
        <div class="phone-3d-wrap" id="phone3dWrap">
          <div class="phone-3d-v2" id="phone3dV2">
            <div class="phone-3d-v2-body">
              <div class="phone-3d-v2-notch"></div>
              <div class="phone-3d-v2-screen" id="phoneScreen">

                <!-- Status bar -->
                <div class="ph-status">
                  <span>9:41</span>
                  <span class="ph-status-icons">
                    <span class="ph-sig">●●●●</span>
                    <span class="ph-bat">▮▮▮▮</span>
                  </span>
                </div>

                <!-- App Grid -->
                <div class="ph-grid" id="phGrid">
                  <div class="ph-app" data-app="dogo">
                    <div class="ph-app-icon" style="background:#fff">
                      <img src="images/dogo/icon.png" alt="Dogo" style="width:100%;height:100%;object-fit:contain;">
                    </div>
                    <span class="ph-app-label">Dogo</span>
                  </div>
                  <div class="ph-app" data-app="meow">
                    <div class="ph-app-icon" style="background:#fff">
                      <img src="images/meow/icon.png" alt="Meow Smart" style="width:100%;height:100%;object-fit:contain;">
                    </div>
                    <span class="ph-app-label">Meow<br>Smart</span>
                  </div>
                </div>

                <!-- Dock -->
                <div class="ph-dock">
                  <div class="ph-dock-icon" style="background:linear-gradient(135deg,#fbbf24,#f59e0b)"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5"><circle cx="8" cy="8" r="3"/><rect x="2" y="2" width="20" height="20" rx="3"/><path d="M2 16l5-5 4 4 4-4 5 5"/></svg></div>
                  <div class="ph-dock-icon" style="background:linear-gradient(135deg,#60a5fa,#3b82f6)"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 4l-10 8L2 4"/></svg></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Info Panel — only shows on hover -->
      <div class="info-column">
        <div class="app-info-panel" id="appInfoPanel">
          <div class="app-info-placeholder" id="appInfoPlaceholder">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--text-dim)" stroke-width="1"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
            <p>悬停 App 图标<br>查看项目简介</p>
          </div>
          <div class="app-info-content" id="appInfoContent">
            <div class="app-info-icon-lg" id="appInfoIcon"></div>
            <h2 class="app-info-name" id="appInfoName"></h2>
            <p class="app-info-summary" id="appInfoSummary"></p>
            <div class="app-info-tags" id="appInfoTags"></div>
            <a href="project1.html" class="app-info-cta" id="appInfoCta">查看项目详情 →</a>
          </div>
        </div>
      </div>

    </div>
  </section>

  <footer class="footer-v2">© 2026 Huijing Gong</footer>
  <div class="page-transition" id="pageTransition"></div>

  <script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module" src="js/subpage-bg.js"></script>
  <script src="js/apps.js?v=3"></script>
</body>
</html>
