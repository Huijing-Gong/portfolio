<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640"><style>text{font-family:PingFang SC,Microsoft Yahei,sans-serif} .h{font-size:25px;fill:#f2efdf}.p{font-size:21px;fill:#b8c8cb}</style><text x="30" y="45" class="h">研究方法整理｜观察行为，再回看理解</text><rect x="30" y="100" width="510" height="220" rx="8" fill="#1b303a" stroke="#344c56"/><text x="55" y="145" font-size="18" fill="#d4bd7c">01</text><text x="55" y="189" class="h">自然探索与结构化观察</text><text x="55" y="237" class="p">不预先透露路线，记录停顿、误操作</text><text x="55" y="275" class="p">同时记录求助方式与任务进展</text><rect x="580" y="100" width="510" height="220" rx="8" fill="#1b303a" stroke="#344c56"/><text x="605" y="145" font-size="18" fill="#d4bd7c">02</text><text x="605" y="189" class="h">十分钟进度快照</text><text x="605" y="237" class="p">记录发现的入口、任务与所在位置</text><text x="605" y="275" class="p">衡量可发现性，不把它当通关时限</text><rect x="30" y="360" width="510" height="220" rx="8" fill="#1b303a" stroke="#344c56"/><text x="55" y="405" font-size="18" fill="#d4bd7c">03</text><text x="55" y="449" class="h">任务后回顾与访谈</text><text x="55" y="497" class="p">回到具体卡点：原本想做什么？</text><text x="55" y="535" class="p">哪些提示被看见，又怎样被理解？</text><rect x="580" y="360" width="510" height="220" rx="8" fill="#1b303a" stroke="#344c56"/><text x="605" y="405" font-size="18" fill="#d4bd7c">04</text><text x="605" y="449" class="h">独立问卷与证据对照</text><text x="605" y="497" class="p">收集目标理解、难度与体验评价</text><text x="605" y="535" class="p">与行为记录一起判断设计问题</text></svg>