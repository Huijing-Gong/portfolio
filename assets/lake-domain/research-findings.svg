<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640"><style>text{font-family:PingFang SC,Microsoft Yahei,sans-serif} .h{font-size:25px;fill:#f2efdf}.p{font-size:21px;fill:#b8c8cb}</style><text x="30" y="45" class="h">试玩发现整理｜把整体评分拆成具体问题</text><rect x="30" y="100" width="510" height="220" rx="8" fill="#1b303a" stroke="#344c56"/><text x="55" y="145" font-size="18" fill="#d4bd7c">01</text><text x="55" y="189" class="h">知道最终目标 ≠ 知道下一步</text><text x="55" y="237" class="p">能说出“击败 Boss”，仍会迷路</text><text x="55" y="275" class="p">当前步骤需要稳定、可回看的提示</text><rect x="580" y="100" width="510" height="220" rx="8" fill="#1b303a" stroke="#344c56"/><text x="605" y="145" font-size="18" fill="#d4bd7c">02</text><text x="605" y="189" class="h">整体容易 ≠ 每个场景都容易</text><text x="605" y="237" class="p">Boss、小怪与试炼的压力不一致</text><text x="605" y="275" class="p">按场景检查容错、密度和攻击节奏</text><rect x="30" y="360" width="510" height="220" rx="8" fill="#1b303a" stroke="#344c56"/><text x="55" y="405" font-size="18" fill="#d4bd7c">03</text><text x="55" y="449" class="h">完成操作 ≠ 理解操作已生效</text><text x="55" y="497" class="p">奖励增益、受击与命中不够明确</text><text x="55" y="535" class="p">加强结算、动画、声音与状态反馈</text><rect x="580" y="360" width="510" height="220" rx="8" fill="#1b303a" stroke="#344c56"/><text x="605" y="405" font-size="18" fill="#d4bd7c">04</text><text x="605" y="449" class="h">熟悉一个世界 ≠ 熟悉所有操作</text><text x="605" y="497" class="p">切换模式后重新学习按键</text><text x="605" y="535" class="p">一起核对输入、教程与屏幕提示</text></svg>